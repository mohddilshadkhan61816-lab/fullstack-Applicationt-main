<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1 style="margin-bottom:40px;">Admin Panel</h1>

<h2>Add Project</h2>
<form id="projectForm">
    <input type="text" placeholder="Project Name" id="pname" required />
    <input type="text" placeholder="Image URL" id="pimage" />
    <textarea placeholder="Description" id="pdesc"></textarea>
    <button type="submit">Add Project</button>
</form>

<h2>Add Client</h2>
<form id="clientForm">
    <input type="text" placeholder="Client Name" id="cname" required />
    <input type="text" placeholder="Image URL" id="cimage" />
    <input type="text" placeholder="Designation" id="cdesig" />
    <textarea placeholder="Description" id="cdesc"></textarea>
    <button type="submit">Add Client</button>
</form>

<h2>Contact Submissions</h2>
<div id="contacts"></div>

<h2>Newsletter Subscribers</h2>
<div id="subscribers"></div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
